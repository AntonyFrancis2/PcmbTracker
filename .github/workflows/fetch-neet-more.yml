# Temporary: collects NEET 2019-2023 paper PDFs for the quiz question bank.
name: Fetch more NEET data
on:
  push:
    branches: [neet-more-data]
    paths: [.github/workflows/fetch-neet-more.yml, neet-more/fetch.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 neet-more/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neet-more
          git commit -m "NEET data fetch" || echo nothing
          git push
