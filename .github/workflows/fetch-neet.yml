# Temporary: downloads the NEET part of the Reja1/jee-neet-benchmark dataset (MIT) into this branch.
name: Fetch NEET data
on:
  push:
    branches: [neet-data-fetch]
    paths: [.github/workflows/fetch-neet.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, time
          base = "https://huggingface.co/datasets/Reja1/jee-neet-benchmark/resolve/main/images/"
          def get(u):
              for i in range(5):
                  try:
                      with urllib.request.urlopen(u, timeout=60) as r: return r.read()
                  except Exception as e:
                      print("retry", u, e); time.sleep(3)
              raise SystemExit("failed " + u)
          os.makedirs("neet-raw", exist_ok=True)
          meta = get(base + "metadata.jsonl").decode()
          open("neet-raw/metadata-all.jsonl", "w").write(meta)
          rows = [json.loads(l) for l in meta.splitlines() if l.strip()]
          neet = [r for r in rows if "NEET" in str(r.get("exam_name", "")).upper()]
          print("total", len(rows), "neet", len(neet)); print(json.dumps(neet[0])[:500])
          for r in neet:
              fn = r.get("file_name") or r.get("image")
              out = os.path.join("neet-raw", fn)
              os.makedirs(os.path.dirname(out), exist_ok=True)
              open(out, "wb").write(get(base + fn))
          print("done")
          PY
          du -sh neet-raw
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neet-raw
          git commit -m "NEET raw data from Reja1/jee-neet-benchmark (MIT)"
          git push
